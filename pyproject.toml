[project]
name = "staffing-pipeline"
version = "0.1.0"
description = "Excel-to-DuckDB project staffing pipeline"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "dbt-duckdb>=1.9,<2",
    "duckdb>=1.2,<2",
    "openpyxl>=3.1,<4",
]

[project.scripts]
ingest-staffing = "staffing_pipeline.ingest:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/staffing_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests_python"]
addopts = "-q"

